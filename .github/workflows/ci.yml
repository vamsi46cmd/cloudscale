name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: cloudscale
          POSTGRES_PASSWORD: cloudscale-dev
          POSTGRES_DB: cloudscale_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudscale" --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Unit + integration tests
        run: mvn -B -f backend/pom.xml verify

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart
        run: |
          helm lint infrastructure/helm/cloudscale
          helm template cs infrastructure/helm/cloudscale -f infrastructure/helm/values-kind.yaml > /dev/null

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infrastructure/terraform/environments/dev
      - run: terraform validate
        working-directory: infrastructure/terraform/environments/dev
