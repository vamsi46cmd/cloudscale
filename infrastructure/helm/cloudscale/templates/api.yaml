apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "cloudscale.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # never drop below the desired ready count during a rollout
  selector:
    matchLabels: {{- include "cloudscale.selector" (dict "Release" .Release "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cloudscale.selector" (dict "Release" .Release "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "cloudscale.podspec" (dict "root" . "component" "api" "workerEnabled" "false" "resources" .Values.api.resources) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "cloudscale.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "cloudscale.selector" (dict "Release" .Release "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
