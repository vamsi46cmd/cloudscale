apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels: {{- include "cloudscale.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {{- include "cloudscale.selector" (dict "Release" .Release "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cloudscale.selector" (dict "Release" .Release "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "cloudscale.podspec" (dict "root" . "component" "worker" "workerEnabled" "true" "resources" .Values.worker.resources) | nindent 6 }}
